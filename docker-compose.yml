services:
  chamados-ti:
    container_name: chamadosti-app
    build: .
    ports:
      - "${CHAMADOSTI_BIND:-0.0.0.0}:${CHAMADOSTI_PORT:-8000}:8000"
    restart: always
    env_file:
      - .env
    environment:
      # Sem MYSQL_HOST no .env o app usa SQLite neste volume (ambiente de teste).
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - chamadosti-dados:/data
    networks:
      - network-chamadosti

volumes:
  chamadosti-dados:

networks:
  network-chamadosti:
    driver: bridge
