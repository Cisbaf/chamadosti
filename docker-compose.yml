services:
  chamados-ti:
    container_name: chamadosti-app
    build: .
    ports:
      - "${CHAMADOSTI_PORT}:8000"
    restart: always
    env_file:
      - .env
    networks:
      - network-chamadosti
      - cisbaf_network_apps  # rede do mysql-container do VPS
      - notificacoes_net  # gateway de notificações (WhatsApp)
    environment:
      MYSQL_HOST: mysql-container
      MYSQL_PORT: ${MYSQL_DB_PORT}
      MYSQL_DATABASE: chamadosti
      MYSQL_USER: chamadosti
      MYSQL_PASSWORD: ${MYSQL_CHAMADOSTI_PASS}
networks:
  network-chamadosti:
    driver: bridge
  cisbaf_network_apps:
    external: true
  notificacoes_net:
    external: true
